<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Volei Pro - Hamilton Jr</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b101d; --card: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8; --accent: #f43f5e; --success: #22c55e;
            --white: #f8fafc; --border: rgba(255, 255, 255, 0.1);
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--white); margin: 0; padding-bottom: 110px; overflow-x: hidden; }
        #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 3000; }
        .login-box { background: var(--card); backdrop-filter: blur(20px); padding: 35px; border-radius: 28px; border: 1px solid var(--border); text-align: center; width: 85%; max-width: 320px; }
        .login-box input { width: 100%; padding: 14px; margin: 20px 0; border-radius: 12px; border: 1px solid var(--border); background: #1e293b; color: white; text-align: center; box-sizing: border-box; font-size: 16px; }
        header { padding: 15px; text-align: center; }
        header h1 { margin: 0; font-size: 1rem; font-weight: 800; color: var(--primary); }
        .nav-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 450px; background: rgba(30, 41, 59, 0.95); display: flex; padding: 6px; border-radius: 20px; border: 1px solid var(--border); z-index: 2000; }
        .nav-item { flex: 1; padding: 10px; text-align: center; font-size: 0.65rem; font-weight: 700; color: #64748b; cursor: pointer; border-radius: 15px; }
        .nav-item.active { background: var(--primary); color: var(--bg); }
        .section { display: none; padding: 10px; }
        .section.active { display: block; }
        
        /* Estilos Placar e Rotação */
        .scoreboard { display: flex; justify-content: space-around; align-items: center; background: var(--card); padding: 15px; border-radius: 20px; margin-bottom: 15px; border: 1px solid var(--border); }
        .score-box { text-align: center; }
        .score-num { font-size: 2.5rem; font-weight: 800; color: var(--primary); display: block; }
        .score-btn { background: var(--primary); color: var(--bg); border: none; padding: 10px 20px; border-radius: 10px; font-weight: 800; margin-top: 10px; width: 100%; }
        .score-btn.adv { background: var(--accent); color: white; }

        .live-court { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #2d4a8a; padding: 20px; border-radius: 10px; position: relative; border: 2px solid white; max-width: 350px; margin: 0 auto; }
        .live-pos { background: rgba(255,255,255,0.1); aspect-ratio: 1; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; border: 1px solid rgba(255,255,255,0.3); position: relative; }
        .pos-label { font-size: 0.5rem; color: #cbd5e1; position: absolute; top: 5px; }
        .server-ball { width: 12px; height: 12px; background: #fbbf24; border-radius: 50%; position: absolute; bottom: -5px; animation: bounce 0.6s infinite alternate; box-shadow: 0 0 10px #fbbf24; }
        
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }

        /* Estilos das outras abas */
        .athlete-card { background: var(--card); border: 1px solid var(--border); margin-bottom: 5px; padding: 8px 12px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; }
        .athlete-num { background: var(--primary); color: var(--bg); font-weight: 800; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 5px; font-size: 0.75rem; }
        .set-mini-court { background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 10px; border-radius: 15px; margin-bottom: 15px; }
        .court-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .pos-box { background: var(--card); padding: 5px; border-radius: 8px; text-align: center; }
        select { background: transparent; color: var(--white); border: none; font-size: 1rem; font-weight: 800; width: 100%; text-align: center; outline: none; }
        option { background-color: #1e293b; color: white; }
        .switch { width: 36px; height: 20px; background: #334155; border-radius: 20px; position: relative; appearance: none; cursor: pointer; }
        .switch:checked { background: var(--success); }
        .switch::before { content: ''; position: absolute; width: 14px; height: 14px; background: white; border-radius: 50%; top: 3px; left: 3px; transition: 0.2s; }
        .switch:checked::before { left: 19px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h1>VOLEI PRO</h1>
        <input type="password" id="passInput" placeholder="Senha">
        <button onclick="checkPass()" style="width:100%; padding:14px; border-radius:12px; border:none; background:var(--primary); font-weight:800; cursor:pointer;">ENTRAR</button>
    </div>
</div>

<header>
    <h1 id="header-title">INICIADAS B</h1>
</header>

<div class="nav-bar">
    <div class="nav-item active" id="btn-convocacao" onclick="showTab('convocacao')">CONVOCAR</div>
    <div class="nav-item" id="btn-sets" onclick="showTab('sets')">QUADRA</div>
    <div class="nav-item" id="btn-live" onclick="showTab('live')">LIVE JOGO</div>
</div>

<section id="convocacao" class="section active">
    <div id="athlete-list"></div>
</section>

<section id="sets" class="section">
    <div id="sets-container"></div>
</section>

<section id="live" class="section">
    <div style="text-align:center; margin-bottom: 10px;">
        <select id="live-set-selector" onchange="initLiveSet()" style="width: auto; background: var(--card); padding: 5px 15px; border-radius: 10px; border: 1px solid var(--border);">
            <option value="1">SET 1</option>
            <option value="2">SET 2</option>
            <option value="3">SET 3</option>
            <option value="4">SET 4</option>
            <option value="5">SET 5</option>
        </select>
    </div>

    <div class="scoreboard">
        <div class="score-box">
            <span style="font-size: 0.7rem; font-weight: 700;">NÓS</span>
            <span class="score-num" id="score-home">0</span>
            <button class="score-btn" onclick="addPoint('home')">+ PONTO</button>
        </div>
        <div style="font-weight: 800; font-size: 1.5rem; margin-top: 15px;">VS</div>
        <div class="score-box">
            <span style="font-size: 0.7rem; font-weight: 700;">ADV</span>
            <span class="score-num" id="score-away">0</span>
            <button class="score-btn adv" onclick="addPoint('away')">+ PONTO</button>
        </div>
    </div>

    <div class="live-court" id="live-court-render">
        </div>
    
    <div style="text-align: center; margin-top: 15px;">
        <button onclick="resetLive()" style="background:none; border: 1px solid var(--accent); color: var(--accent); padding: 5px 15px; border-radius: 8px; font-size: 0.7rem;">Reiniciar Set</button>
    </div>
</section>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD3eeZF56QX--Mh8IuR1d78te3hC7c10VQ",
        authDomain: "iniciadas-87351.firebaseapp.com",
        projectId: "iniciadas-87351",
        storageBucket: "iniciadas-87351.firebasestorage.app",
        messagingSenderId: "1029800013091",
        appId: "1:1029800013091:web:6a1020b1099c83f37cf096"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const atletas = [
        {n: 1, nome: "Carla"}, {n: 3, nome: "Barbara"}, {n: 6, nome: "Matilde R."},
        {n: 7, nome: "Matilde S."}, {n: 9, nome: "Nathy"}, {n: 10, nome: "Maria S."},
        {n: 11, nome: "Bia"}, {n: 12, nome: "Carolina R."}, {n: 13, nome: "Clara"},
        {n: 15, nome: "Zita"}, {n: 17, nome: "Malu"}, {n: 19, nome: "Nadii"},
        {n: 20, nome: "Kia"}, {n: 22, nome: "Carolina V."}, {n: 26, nome: "Luana"},
        {n: 55, nome: "Loureiro"}, {n: 99, nome: "Carol"}
    ];

    let state = { conv: [], sets: {} };
    let liveState = {
        home: 0, away: 0,
        serving: 'home', // 'home' ou 'away'
        rotation: [4, 3, 2, 5, 6, 1], // Ordem visual na quadra (Posições)
        currentLineup: [] // Números das atletas nas posições [P4, P3, P2, P5, P6, P1]
    };

    onSnapshot(doc(db, "gestao", "atual"), (snap) => {
        if(snap.exists()) {
            state = snap.data();
            render();
            if(liveState.currentLineup.length === 0) initLiveSet();
        }
    });

    async function sync() { await setDoc(doc(db, "gestao", "atual"), state); }

    window.toggle = (n) => {
        state.conv = state.conv.includes(n) ? state.conv.filter(i => i !== n) : [...state.conv, n];
        sync(); render();
    };

    window.updatePos = (key, val) => {
        state.sets[key] = val;
        sync();
    };

    // --- LÓGICA LIVE JOGO ---

    window.initLiveSet = () => {
        const s = document.getElementById('live-set-selector').value;
        // Posições na ordem: P4, P3, P2 (Rede) / P5, P6, P1 (Fundo)
        liveState.currentLineup = [
            state.sets[`s${s}p4`] || "?", state.sets[`s${s}p3`] || "?", state.sets[`s${s}p2`] || "?",
            state.sets[`s${s}p5`] || "?", state.sets[`s${s}p6`] || "?", state.sets[`s${s}p1`] || "?"
        ];
        renderLive();
    };

    window.addPoint = (team) => {
        if(team === 'home') {
            if(liveState.serving === 'away') {
                rotate(); // Side-out: Rodamos antes de servir
            }
            liveState.home++;
            liveState.serving = 'home';
        } else {
            liveState.away++;
            liveState.serving = 'away';
        }
        renderLive();
    };

    function rotate() {
        // Rotação oficial: 1->6->5->4->3->2->1
        // No nosso array [P4(0), P3(1), P2(2), P5(3), P6(4), P1(5)]
        const old = [...liveState.currentLineup];
        liveState.currentLineup[5] = old[2]; // P2 vai para P1
        liveState.currentLineup[4] = old[5]; // P1 vai para P6
        liveState.currentLineup[3] = old[4]; // P6 vai para P5
        liveState.currentLineup[0] = old[3]; // P5 vai para P4
        liveState.currentLineup[1] = old[0]; // P4 vai para P3
        liveState.currentLineup[2] = old[1]; // P3 vai para P2
    }

    window.resetLive = () => {
        liveState.home = 0; liveState.away = 0; liveState.serving = 'home';
        initLiveSet();
    };

    function renderLive() {
        document.getElementById('score-home').innerText = liveState.home;
        document.getElementById('score-away').innerText = liveState.away;

        const court = document.getElementById('live-court-render');
        const labels = [4, 3, 2, 5, 6, 1];
        court.innerHTML = liveState.currentLineup.map((num, i) => `
            <div class="live-pos">
                <span class="pos-label">P${labels[i]}</span>
                ${num}
                ${(liveState.serving === 'home' && labels[i] === 1) ? '<div class="server-ball"></div>' : ''}
            </div>
        `).join('');
    }

    // --- RENDER GERAL ---

    function render() {
        document.getElementById('athlete-list').innerHTML = atletas.map(a => `
            <div class="athlete-card">
                <div style="display:flex; align-items:center; gap:8px;">
                    <div class="athlete-num">${a.n}</div>
                    <span style="font-size:0.75rem;">${a.nome}</span>
                </div>
                <input type="checkbox" class="switch" ${state.conv.includes(a.n) ? 'checked' : ''} onchange="toggle(${a.n})">
            </div>
        `).join('');

        document.getElementById('sets-container').innerHTML = [1,2,3,4,5].map(s => `
            <div class="set-mini-court">
                <div style="font-size:0.75rem; font-weight:800; color:var(--primary); margin-bottom:5px;">SET ${s}</div>
                <div class="court-grid">
                    ${[4,3,2,5,6,1].map(p => `
                        <div class="pos-box">
                            <label style="font-size:0.45rem; color:#94a3b8;">P${p}</label>
                            <select onchange="updatePos('s${s}p${p}', this.value)">
                                <option value="">-</option>
                                ${state.conv.sort((a,b)=>a-b).map(n => `<option value="${n}" ${state.sets['s'+s+'p'+p] == n ? 'selected' : ''}>${n}</option>`).join('')}
                            </select>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    window.showTab = (tab) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
        document.getElementById(tab).classList.add('active');
        document.getElementById('btn-' + tab).classList.add('active');
        if(tab === 'live') renderLive();
    };

    window.checkPass = () => {
        if(document.getElementById('passInput').value === 'volei2026') {
            document.getElementById('login-screen').style.display = 'none'; render();
        }
    };
</script>
</body>
</html>
