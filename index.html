<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Volei Pro - Hamilton Jr</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b101d; --card: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8; --accent: #f43f5e; --success: #22c55e;
            --white: #f8fafc; --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg); color: var(--white);
            margin: 0; padding-bottom: 110px;
            overflow-x: hidden;
        }

        /* Login */
        #login-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; align-items: center; justify-content: center; z-index: 3000;
        }

        .login-box {
            background: var(--card); backdrop-filter: blur(20px);
            padding: 35px; border-radius: 28px; border: 1px solid var(--border);
            text-align: center; width: 85%; max-width: 320px;
        }

        .login-box input {
            width: 100%; padding: 14px; margin: 20px 0; border-radius: 12px;
            border: 1px solid var(--border); background: #1e293b; color: white;
            text-align: center; box-sizing: border-box; font-size: 16px;
        }

        /* Header e Nav */
        header { padding: 20px; text-align: center; }
        header h1 { margin: 0; font-size: 1.1rem; font-weight: 800; color: var(--primary); }

        .nav-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: rgba(30, 41, 59, 0.95);
            display: flex; padding: 6px; border-radius: 20px; border: 1px solid var(--border); z-index: 2000;
        }

        .nav-item {
            flex: 1; padding: 12px; text-align: center; font-size: 0.75rem;
            font-weight: 700; color: #64748b; cursor: pointer; border-radius: 15px;
        }

        .nav-item.active { background: var(--primary); color: var(--bg); }

        .section { display: none; padding: 10px; }
        .section.active { display: block; }

        /* Lista Atletas */
        #athlete-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; max-width: 900px; margin: 0 auto; }
        .athlete-card {
            background: var(--card); border: 1px solid var(--border);
            padding: 10px 15px; border-radius: 14px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .athlete-num { background: var(--primary); color: var(--bg); font-weight: 800; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 0.8rem; }

        /* Quadras */
        #sets-container { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 10px; }
        @media (min-width: 600px) { #sets-container { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1000px) { #sets-container { grid-template-columns: repeat(3, 1fr); } }

        .set-mini-court { background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 12px; border-radius: 18px; }
        .court-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .pos-box { background: var(--card); padding: 8px 4px; border-radius: 10px; text-align: center; }
        
        select { background: transparent; color: var(--white); border: none; font-size: 1rem; font-weight: 800; width: 100%; text-align: center; outline: none; }
        option { background-color: #1e293b; color: white; }

        /* WhatsApp Button Area */
        .whatsapp-area {
            max-width: 400px; margin: 20px auto; text-align: center;
            background: rgba(34, 197, 94, 0.1); border: 1px dashed var(--success);
            padding: 15px; border-radius: 20px;
        }

        .btn-whatsapp {
            background: var(--success); color: white; border: none; padding: 12px 20px;
            border-radius: 12px; font-weight: 800; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 10px; width: 100%;
        }

        .switch { width: 40px; height: 22px; background: #334155; border-radius: 20px; position: relative; appearance: none; cursor: pointer; }
        .switch:checked { background: var(--success); }
        .switch::before { content: ''; position: absolute; width: 16px; height: 16px; background: white; border-radius: 50%; top: 3px; left: 3px; transition: 0.2s; }
        .switch:checked::before { left: 21px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h1 style="color: var(--primary); margin:0;">VOLEI PRO</h1>
        <input type="password" id="passInput" placeholder="Senha">
        <button onclick="checkPass()" style="width:100%; padding:14px; border-radius:12px; border:none; background:var(--primary); color:var(--bg); font-weight:800; cursor:pointer;">ENTRAR</button>
    </div>
</div>

<header>
    <h1>INICIADAS B - GESTÃO</h1>
    <div id="sync-status" style="display:none; font-size: 0.6rem; color: var(--success);">● LIVE SYNC</div>
</header>

<div class="nav-bar">
    <div class="nav-item active" id="btn-convocacao" onclick="showTab('convocacao')">CONVOCAR</div>
    <div class="nav-item" id="btn-sets" onclick="showTab('sets')">QUADRA</div>
</div>

<section id="convocacao" class="section active">
    <div class="whatsapp-area">
        <button class="btn-whatsapp" onclick="gerarMensagem()">
            <span style="font-size: 1.2rem;">💬</span> Gerar Lista WhatsApp
        </button>
    </div>
    <div id="athlete-list"></div>
</section>

<section id="sets" class="section">
    <div id="sets-container"></div>
</section>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD3eeZF56QX--Mh8IuR1d78te3hC7c10VQ",
        authDomain: "iniciadas-87351.firebaseapp.com",
        projectId: "iniciadas-87351",
        storageBucket: "iniciadas-87351.firebasestorage.app",
        messagingSenderId: "1029800013091",
        appId: "1:1029800013091:web:6a1020b1099c83f37cf096"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const atletas = [
        {n: 1, nome: "Carla Rodrigues"}, {n: 3, nome: "Barbara Fernandes"}, {n: 6, nome: "Matilde Rocha"},
        {n: 7, nome: "Matilde Silva"}, {n: 9, nome: "Nataliia Karpets"}, {n: 10, nome: "Maria Luisa Soutelo"},
        {n: 11, nome: "Beatriz Brito"}, {n: 12, nome: "Carolina Rodrigues"}, {n: 13, nome: "Clara Ferreira"},
        {n: 15, nome: "Zita Macedo"}, {n: 17, nome: "Maria Luisa Baptista"}, {n: 19, nome: "Nadia Silva"},
        {n: 20, nome: "Francisca Miranda"}, {n: 22, nome: "Carolina Verissimo"}, {n: 26, nome: "Luana Santana"},
        {n: 55, nome: "Matilde Loureiro"}, {n: 99, nome: "Carolina Braga"}
    ];

    let state = { conv: [], sets: {} };

    onSnapshot(doc(db, "gestao", "atual"), (snap) => {
        if(snap.exists()) {
            state = snap.data();
            document.getElementById('sync-status').style.display = 'block';
        }
        render();
    });

    async function sync() {
        await setDoc(doc(db, "gestao", "atual"), state);
    }

    window.toggle = (n) => {
        state.conv = state.conv.includes(n) ? state.conv.filter(i => i !== n) : [...state.conv, n];
        sync(); render();
    };

    window.updatePos = (key, val) => {
        state.sets[key] = val;
        sync();
    };

    window.gerarMensagem = () => {
        if(state.conv.length === 0) return alert("Nenhuma atleta convocada!");
        
        let lista = atletas
            .filter(a => state.conv.includes(a.n))
            .map(a => `➡ ${a.nome}`)
            .join('\n');

        let texto = `*Troféu AVB/AVVC Iniciadas B Fem* \n\n🏟  *ES ALCAIDES FARIA*\n\n📆  *25/04/2026 (Sábado)*\n⏰ *12h*\n(Concentração 11h no local)\n\n*CONVOCADAS:*\n\n${lista}`;
        
        // Copiar para a área de transferência
        navigator.clipboard.writeText(texto).then(() => {
            alert("Mensagem copiada! Agora é só colar no WhatsApp das meninas.");
        });
    };

    function render() {
        document.getElementById('athlete-list').innerHTML = atletas.map(a => `
            <div class="athlete-card">
                <div style="display:flex; align-items:center; gap:8px;">
                    <div class="athlete-num">${a.n}</div>
                    <span style="font-size:0.75rem; font-weight:600;">${a.nome}</span>
                </div>
                <input type="checkbox" class="switch" ${state.conv.includes(a.n) ? 'checked' : ''} onchange="toggle(${a.n})">
            </div>
        `).join('');

        document.getElementById('sets-container').innerHTML = [1,2,3,4,5].map(s => `
            <div class="set-mini-court">
                <div style="font-size:0.8rem; font-weight:800; color:var(--primary); margin-bottom:10px;">SET ${s}</div>
                <div class="court-grid">
                    ${[4,3,2,5,6,1].map(p => `
                        <div class="pos-box">
                            <label style="font-size:0.5rem; color:#94a3b8; display:block;">P${p}</label>
                            <select onchange="updatePos('s${s}p${p}', this.value)">
                                <option value="">-</option>
                                ${state.conv.sort((a,b)=>a-b).map(n => `<option value="${n}" ${state.sets['s'+s+'p'+p] == n ? 'selected' : ''}>${n}</option>`).join('')}
                            </select>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    window.showTab = (tab) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
        document.getElementById(tab).classList.add('active');
        document.getElementById('btn-' + tab).classList.add('active');
    };

    window.checkPass = () => {
        if(document.getElementById('passInput').value === 'volei2026') {
            document.getElementById('login-screen').style.display = 'none';
            render();
        }
    };
</script>
</body>
</html>
