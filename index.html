<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Volei Pro - Hamilton Jr</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b101d; --card: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8; --accent: #f43f5e; --success: #22c55e;
            --white: #f8fafc; --border: rgba(255, 255, 255, 0.1);
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--white); margin: 0; padding-bottom: 110px; overflow-x: hidden; }
        #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 3000; }
        .login-box { background: var(--card); backdrop-filter: blur(20px); padding: 35px; border-radius: 28px; border: 1px solid var(--border); text-align: center; width: 85%; max-width: 320px; }
        .login-box input { width: 100%; padding: 14px; margin: 20px 0; border-radius: 12px; border: 1px solid var(--border); background: #1e293b; color: white; text-align: center; box-sizing: border-box; font-size: 16px; }
        header { padding: 15px; text-align: center; }
        header h1 { margin: 0; font-size: 1rem; font-weight: 800; color: var(--primary); }
        .nav-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 500px; background: rgba(30, 41, 59, 0.95); display: flex; padding: 6px; border-radius: 20px; border: 1px solid var(--border); z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .nav-item { flex: 1; padding: 10px; text-align: center; font-size: 0.65rem; font-weight: 700; color: #64748b; cursor: pointer; border-radius: 15px; transition: 0.3s; }
        .nav-item.active { background: var(--primary); color: var(--bg); }
        .section { display: none; padding: 10px; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .game-info-card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 18px; margin-bottom: 20px; max-width: 500px; margin: 0 auto 20px; }
        .game-info-card input { width: 100%; padding: 10px; margin: 5px 0 12px; border-radius: 8px; border: 1px solid var(--border); background: #1e293b; color: white; box-sizing: border-box; }
        #athlete-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; max-width: 900px; margin: 0 auto; }
        .athlete-card { background: var(--card); border: 1px solid var(--border); padding: 8px 12px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; }
        .athlete-num { background: var(--primary); color: var(--bg); font-weight: 800; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 0.75rem; }
        #sets-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; padding: 10px; }
        .set-mini-court { background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 12px; border-radius: 18px; }
        .court-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .pos-box { background: var(--card); padding: 6px 2px; border-radius: 8px; text-align: center; border: 1px solid transparent; }
        .pos-box.occupied { border-color: var(--primary); }
        .pos-box select { background: transparent; color: white; border: none; font-size: 1rem; font-weight: bold; width: 100%; text-align-last: center; }
        .scoreboard { display: flex; justify-content: space-around; align-items: center; background: var(--card); padding: 15px; border-radius: 20px; margin-bottom: 20px; border: 1px solid var(--border); max-width: 400px; margin: 0 auto 20px; }
        .score-num { font-size: 2.5rem; font-weight: 800; color: var(--primary); display: block; cursor: pointer; }
        .score-btn { background: var(--primary); color: var(--bg); border: none; padding: 12px; border-radius: 10px; font-weight: 800; width: 100%; margin-top: 10px; }
        .score-btn.adv { background: var(--accent); color: white; }
        .live-court { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; background: #1e3a8a; padding: 25px; border-radius: 15px; border: 2px solid white; max-width: 320px; margin: 0 auto; }
        .live-pos { background: rgba(255,255,255,0.15); aspect-ratio: 1; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 1.2rem; border: 1px solid rgba(255,255,255,0.4); position: relative; }
        .pos-label { font-size: 0.55rem; color: #cbd5e1; position: absolute; top: 6px; font-weight: 700; }
        .server-ball { width: 14px; height: 14px; background: #fbbf24; border-radius: 50%; position: absolute; bottom: -6px; }
        .switch { width: 36px; height: 20px; background: #334155; border-radius: 20px; position: relative; appearance: none; cursor: pointer; }
        .switch:checked { background: var(--success); }
        .switch::before { content: ''; position: absolute; width: 14px; height: 14px; background: white; border-radius: 50%; top: 3px; left: 3px; transition: 0.2s; }
        .switch:checked::before { left: 19px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h1 style="color: var(--primary); margin:0;">VOLEI PRO</h1>
        <input type="password" id="passInput" placeholder="Senha">
        <button onclick="checkPass()" style="width:100%; padding:14px; border-radius:12px; border:none; background:var(--primary); color:var(--bg); font-weight:800; cursor:pointer;">ENTRAR</button>
    </div>
</div>

<header>
    <h1>INICIADAS B - GESTÃO</h1>
    <div id="sync-status" style="display:none; font-size: 0.5rem; color: var(--success); text-align: center;">● LIVE SYNC</div>
</header>

<div class="nav-bar">
    <div class="nav-item active" id="btn-convocacao" onclick="showTab('convocacao')">CONVOCAR</div>
    <div class="nav-item" id="btn-sets" onclick="showTab('sets')">QUADRA</div>
    <div class="nav-item" id="btn-live" onclick="showTab('live')">LIVE</div>
    <div class="nav-item" id="btn-logs" onclick="showTab('logs')">LOGS</div>
</div>

<section id="convocacao" class="section active">
    <div class="game-info-card">
        <label style="font-size: 0.6rem; color: var(--primary);">NOME DO ADVERSÁRIO</label>
        <input type="text" id="adv-name" placeholder="Ex: SC Braga" onchange="updateAdvName(this.value)">
    </div>
    <div id="athlete-list"></div>
</section>

<section id="sets" class="section">
    <div id="sets-container"></div>
</section>

<section id="live" class="section">
    <div style="text-align:center; margin-bottom: 15px;">
        <select id="live-set-selector" onchange="changeSet(this.value)" style="background: var(--card); color: var(--primary); padding: 5px 10px; border-radius: 8px; font-weight: bold;">
            <option value="1">SET 1</option><option value="2">SET 2</option><option value="3">SET 3</option><option value="4">SET 4</option><option value="5">SET 5</option>
        </select>
    </div>
    <div class="scoreboard">
        <div style="text-align:center; flex:1;">
            <span class="score-num" id="score-home" onclick="removePoint('home')">0</span>
            <button class="score-btn" onclick="addPoint('home')">+ PONTO</button>
        </div>
        <div style="text-align:center; flex:1;">
            <span class="score-num" id="score-away" onclick="removePoint('away')">0</span>
            <button class="score-btn adv" onclick="addPoint('away')">+ PONTO</button>
        </div>
    </div>
    <div class="live-court" id="live-court-render"></div>
</section>

<section id="logs" class="section">
    <div id="logs-container" style="max-width: 500px; margin: auto;"></div>
    <button onclick="clearLogs()" style="width:100%; max-width: 500px; display: block; margin: 20px auto; background: var(--accent); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer;">LIMPAR HISTÓRICO</button>
</section>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD3eeZF56QX--Mh8IuR1d78te3hC7c10VQ",
        authDomain: "iniciadas-87351.firebaseapp.com",
        projectId: "iniciadas-87351",
        storageBucket: "iniciadas-87351.firebasestorage.app",
        messagingSenderId: "1029800013091",
        appId: "1:1029800013091:web:6a1020b1099c83f37cf096"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ATLETAS_PADRAO = [
        {n: 1, nome: "Carla Rodrigues"}, {n: 3, nome: "Barbara Fernandes"}, {n: 6, nome: "Matilde Rocha"},
        {n: 7, nome: "Matilde Silva"}, {n: 9, nome: "Nataliia Karpets"}, {n: 10, nome: "Maria Luisa Soutelo"},
        {n: 11, nome: "Beatriz Brito"}, {n: 12, nome: "Carolina Rodrigues"}, {n: 13, nome: "Clara Ferreira"},
        {n: 15, nome: "Zita Macedo"}, {n: 17, nome: "Maria Luisa Baptista"}, {n: 19, nome: "Nadia Silva"},
        {n: 20, nome: "Francisca Miranda"}, {n: 22, nome: "Carolina Verissimo"}, {n: 26, nome: "Luana Santana"},
        {n: 55, nome: "Matilde Loureiro"}, {n: 99, nome: "Carolina Braga"}
    ];

    let state = { conv: [], sets: {}, atletas: ATLETAS_PADRAO, advName: "ADV", logs: [] };
    let liveState = { currentSet: "1", home: 0, away: 0, serving: 'home', currentLineup: ["?", "?", "?", "?", "?", "?"] };

    // FUNÇÃO DE RENDERIZAÇÃO COM SEGURANÇA (O CORAÇÃO DO FIX)
    window.render = () => {
        try {
            // Atletas na Convocação
            const aList = document.getElementById('athlete-list');
            if (aList) {
                const atletasParaRenderizar = state.atletas || ATLETAS_PADRAO;
                aList.innerHTML = atletasParaRenderizar.map(a => `
                    <div class="athlete-card">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <div class="athlete-num">${a.n}</div>
                            <span style="font-size:0.75rem;">${a.nome}</span>
                        </div>
                        <input type="checkbox" class="switch" ${(state.conv || []).includes(a.n) ? 'checked' : ''} onchange="toggle(${a.n})">
                    </div>
                `).join('');
            }

            // Quadras na aba QUADRA
            const sContainer = document.getElementById('sets-container');
            if (sContainer) {
                const convocadas = (state.conv || []).sort((a,b) => a-b);
                sContainer.innerHTML = [1,2,3,4,5].map(s => `
                    <div class="set-mini-court">
                        <div style="font-size:0.8rem; font-weight:bold; color:var(--primary); margin-bottom:10px;">SET ${s}</div>
                        <div class="court-grid">
                            ${[4,3,2,5,6,1].map(p => {
                                const id = `s${s}p${p}`;
                                const val = (state.sets || {})[id] || "";
                                return `
                                <div class="pos-box ${val ? 'occupied' : ''}">
                                    <label style="font-size:0.5rem; color:#94a3b8;">P${p}</label>
                                    <select onchange="updatePos('${id}', this.value)">
                                        <option value="">-</option>
                                        ${convocadas.map(n => `<option value="${n}" ${val == n ? 'selected' : ''}>${n}</option>`).join('')}
                                    </select>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                `).join('');
            }

            // Logs
            const lContainer = document.getElementById('logs-container');
            if (lContainer) {
                lContainer.innerHTML = (state.logs || []).map(l => `
                    <div style="background:var(--card); padding:12px; border-radius:10px; margin-bottom:8px; border-left: 4px solid var(--primary); font-size: 0.85rem;">
                        ${l}
                    </div>
                `).join('') || "<p style='text-align:center; color:#64748b;'>Sem registos.</p>";
            }
        } catch (e) {
            console.error("Erro no render:", e);
        }
    };

    onSnapshot(doc(db, "gestao", "atual"), (snap) => {
        if(snap.exists()) {
            const data = snap.data();
            state = {
                conv: data.conv || [],
                sets: data.sets || {},
                atletas: data.atletas || ATLETAS_PADRAO,
                advName: data.advName || "ADV",
                logs: data.logs || []
            };
            document.getElementById('sync-status').style.display = 'block';
            if(document.getElementById('adv-name')) document.getElementById('adv-name').value = state.advName;
        }
        window.render();
        initLiveSet();
    });

    async function sync() { await setDoc(doc(db, "gestao", "atual"), state); }

    window.toggle = (n) => {
        if (!state.conv) state.conv = [];
        state.conv = state.conv.includes(n) ? state.conv.filter(i => i !== n) : [...state.conv, n];
        sync(); window.render();
    };

    window.updatePos = (id, val) => {
        if (!state.sets) state.sets = {};
        state.sets[id] = val;
        sync(); window.render();
    };

    window.showTab = (tab) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        const el = document.getElementById(tab);
        if(el) el.classList.add('active');
        const btn = document.getElementById('btn-' + tab);
        if(btn) btn.classList.add('active');
        if(tab === 'live') initLiveSet();
    };

    window.initLiveSet = () => {
        const s = liveState.currentSet;
        const currentSets = state.sets || {};
        liveState.currentLineup = [
            currentSets[`s${s}p4`] || "?", currentSets[`s${s}p3`] || "?", currentSets[`s${s}p2`] || "?",
            currentSets[`s${s}p5`] || "?", currentSets[`s${s}p6`] || "?", currentSets[`s${s}p1`] || "?"
        ];
        renderLive();
    };

    window.renderLive = () => {
        const homeEl = document.getElementById('score-home');
        const awayEl = document.getElementById('score-away');
        if (homeEl) homeEl.innerText = liveState.home;
        if (awayEl) awayEl.innerText = liveState.away;
        
        const court = document.getElementById('live-court-render');
        if(!court) return;
        const labels = [4,3,2,5,6,1];
        court.innerHTML = liveState.currentLineup.map((n, i) => `
            <div class="live-pos">
                <span class="pos-label">P${labels[i]}</span>${n}
                ${(liveState.serving === 'home' && labels[i] === 1) ? '<div class="server-ball"></div>' : ''}
            </div>
        `).join('');
    };

    window.addPoint = (t) => {
        if(t === 'home') { if(liveState.serving === 'away') rotate(); liveState.home++; liveState.serving = 'home'; }
        else { liveState.away++; liveState.serving = 'away'; }
        renderLive();
    };

    window.removePoint = (t) => {
        if(t === 'home' && liveState.home > 0) liveState.home--;
        if(t === 'away' && liveState.away > 0) liveState.away--;
        renderLive();
    };

    function rotate() {
        const old = [...liveState.currentLineup];
        liveState.currentLineup[5] = old[2]; liveState.currentLineup[4] = old[5]; 
        liveState.currentLineup[3] = old[4]; liveState.currentLineup[0] = old[3];
        liveState.currentLineup[1] = old[0]; liveState.currentLineup[2] = old[1];
    }

    window.changeSet = (s) => {
        if (liveState.home > 0 || liveState.away > 0) {
            state.logs.push(`Set ${liveState.currentSet}: FCA ${liveState.home} - ${liveState.away} (${state.advName})`);
        }
        liveState.currentSet = s; liveState.home = 0; liveState.away = 0;
        sync(); initLiveSet(); window.render();
    };

    window.checkPass = () => {
        if(document.getElementById('passInput').value === 'volei2026') {
            document.getElementById('login-screen').style.display = 'none';
            window.render();
        }
    };
    
    window.clearLogs = () => { if(confirm("Limpar histórico?")) { state.logs = []; sync(); window.render(); } };
    window.updateAdvName = (v) => { state.advName = v; sync(); };
</script>
</body>
</html>
