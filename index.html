<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Volei Pro - Hamilton Jr</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b101d; --card: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8; --accent: #f43f5e; --success: #22c55e;
            --white: #f8fafc; --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg); color: var(--white);
            margin: 0; padding-bottom: 100px;
            overflow-x: hidden;
        }

        /* Login Centralizado e Fixo */
        #login-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; align-items: center; justify-content: center; z-index: 3000;
        }

        .login-box {
            background: var(--card); backdrop-filter: blur(20px);
            padding: 35px; border-radius: 28px; border: 1px solid var(--border);
            text-align: center; width: 85%; max-width: 320px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .login-box input {
            width: 100%; padding: 14px; margin: 20px 0; border-radius: 12px;
            border: 1px solid var(--border); background: #1e293b; color: white;
            text-align: center; box-sizing: border-box; font-size: 16px;
        }

        /* Layout Responsivo */
        header { padding: 20px; text-align: center; }
        header h1 { margin: 0; font-size: 1.1rem; font-weight: 800; color: var(--primary); letter-spacing: 1px; }

        .nav-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: rgba(30, 41, 59, 0.95);
            display: flex; padding: 6px; border-radius: 20px; border: 1px solid var(--border); z-index: 2000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .nav-item {
            flex: 1; padding: 12px; text-align: center; font-size: 0.75rem;
            font-weight: 700; color: #64748b; cursor: pointer; border-radius: 15px; transition: 0.3s;
        }

        .nav-item.active { background: var(--primary); color: var(--bg); }

        .section { display: none; padding: 10px; }
        .section.active { display: block; }

        /* Atletas Compactos */
        #athlete-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; max-width: 900px; margin: 0 auto; }
        .athlete-card {
            background: var(--card); border: 1px solid var(--border);
            padding: 10px 15px; border-radius: 14px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .athlete-num { background: var(--primary); color: var(--bg); font-weight: 800; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 0.8rem; }

        /* Grid de Quadras (O Ponto Chave) */
        #sets-container { 
            display: grid; 
            grid-template-columns: 1fr; /* 1 coluna no telemóvel */
            gap: 20px; 
            padding: 10px;
        }

        @media (min-width: 600px) { #sets-container { grid-template-columns: repeat(2, 1fr); } } /* 2 colunas no Tablet vertical */
        @media (min-width: 1000px) { #sets-container { grid-template-columns: repeat(3, 1fr); } } /* 3 colunas no PC/Tablet horizontal */

        .set-mini-court {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border);
            padding: 12px; border-radius: 18px; position: relative;
        }
        .set-title { font-size: 0.8rem; font-weight: 800; color: var(--primary); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

        .court-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .pos-box { background: var(--card); padding: 8px 4px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .pos-box label { display: block; font-size: 0.55rem; color: #94a3b8; margin-bottom: 3px; font-weight: bold; }
        
        select {
            background: transparent; color: var(--white); border: none;
            font-size: 1rem; font-weight: 800; width: 100%; text-align: center; outline: none;
        }
        option { background-color: #1e293b; color: white; } /* Resolve o fundo branco */

        .msg-regra { font-size: 0.65rem; margin-top: 10px; color: #94a3b8; min-height: 30px; border-top: 1px solid var(--border); padding-top: 8px; }

        /* Switch Custom */
        .switch { width: 40px; height: 22px; background: #334155; border-radius: 20px; position: relative; appearance: none; cursor: pointer; }
        .switch:checked { background: var(--success); }
        .switch::before { content: ''; position: absolute; width: 16px; height: 16px; background: white; border-radius: 50%; top: 3px; left: 3px; transition: 0.2s; }
        .switch:checked::before { left: 21px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h1 style="color: var(--primary); margin:0; font-size: 1.5rem;">VOLEI PRO</h1>
        <p style="color: #64748b; font-size: 0.8rem; margin: 5px 0 0 0;">Hamilton Moraes Jr.</p>
        <input type="password" id="passInput" placeholder="Senha">
        <button onclick="checkPass()" style="width:100%; padding:14px; border-radius:12px; border:none; background:var(--primary); color:var(--bg); font-weight:800; cursor:pointer;">ENTRAR</button>
    </div>
</div>

<header>
    <h1>INICIADAS B - GESTÃO</h1>
    <div id="sync-status" style="display:none; font-size: 0.6rem; color: var(--success); margin-top: 5px;">● SISTEMA ONLINE</div>
</header>

<div class="nav-bar">
    <div class="nav-item active" id="btn-convocacao" onclick="showTab('convocacao')">CONVOCAR</div>
    <div class="nav-item" id="btn-sets" onclick="showTab('sets')">QUADRA TÁTICA</div>
</div>

<section id="convocacao" class="section active">
    <div id="athlete-list"></div>
</section>

<section id="sets" class="section">
    <div id="sets-container"></div>
</section>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD3eeZF56QX--Mh8IuR1d78te3hC7c10VQ",
        authDomain: "iniciadas-87351.firebaseapp.com",
        projectId: "iniciadas-87351",
        storageBucket: "iniciadas-87351.firebasestorage.app",
        messagingSenderId: "1029800013091",
        appId: "1:1029800013091:web:6a1020b1099c83f37cf096"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const atletas = [
        {n: 1, nome: "Carla"}, {n: 3, nome: "Barbara"}, {n: 6, nome: "Matilde R."},
        {n: 7, nome: "Matilde S."}, {n: 9, nome: "Nathy"}, {n: 10, nome: "Maria S."},
        {n: 11, nome: "Bia"}, {n: 12, nome: "Carolina R."}, {n: 13, nome: "Clara"},
        {n: 15, nome: "Zita"}, {n: 17, nome: "Malu"}, {n: 19, nome: "Nadii"},
        {n: 20, nome: "Kia"}, {n: 22, nome: "Carolina V."}, {n: 26, nome: "Luana"},
        {n: 55, nome: "Loureiro"}, {n: 99, nome: "Carol"}
    ];

    let state = { conv: [], sets: {} };

    onSnapshot(doc(db, "gestao", "atual"), (snap) => {
        if(snap.exists()) {
            state = snap.data();
            document.getElementById('sync-status').style.display = 'block';
        }
        render();
    });

    async function sync() {
        await setDoc(doc(db, "gestao", "atual"), state);
    }

    window.toggle = (n) => {
        state.conv = state.conv.includes(n) ? state.conv.filter(i => i !== n) : [...state.conv, n];
        sync(); render();
    };

    window.updatePos = (key, val) => {
        state.sets[key] = val;
        sync();
    };

    function validarRegra(setNum) {
        if(setNum === 1) return {ok: true, msg: "Aguardando definição do 1º Set."};
        
        let atual = [];
        for(let p of [1,2,3,4,5,6]) if(state.sets[`s${setNum}p${p}`]) atual.push(parseInt(state.sets[`s${setNum}p${p}`]));
        
        let anterior = [];
        for(let p of [1,2,3,4,5,6]) if(state.sets[`s${setNum-1}p${p}`]) anterior.push(parseInt(state.sets[`s${setNum-1}p${p}`]));

        if(atual.length < 6) return {ok: true, msg: "Preenche as 6 posições."};

        let novos = atual.filter(p => !anterior.includes(p));
        if(novos.length < 3) return {ok: false, msg: `✗ Alínea d): Precisas de 3 novos em relação ao Set ${setNum-1}.`};

        if(setNum >= 3) {
            let antAnt = [];
            for(let p of [1,2,3,4,5,6]) if(state.sets[`s${setNum-2}p${p}`]) antAnt.push(parseInt(state.sets[`s${setNum-2}p${p}`]));
            let infratores = atual.filter(p => anterior.includes(p) && antAnt.includes(p));
            if(infratores.length > 0) return {ok: false, msg: `✗ Alínea d): # ${infratores.join(', ')} jogaram os 2 anteriores.`};
        }

        return {ok: true, msg: "✓ Formação válida!"};
    }

    function render() {
        document.getElementById('athlete-list').innerHTML = atletas.map(a => `
            <div class="athlete-card">
                <div style="display:flex; align-items:center; gap:8px;">
                    <div class="athlete-num">${a.n}</div>
                    <span style="font-size:0.8rem; font-weight:600;">${a.nome}</span>
                </div>
                <input type="checkbox" class="switch" ${state.conv.includes(a.n) ? 'checked' : ''} onchange="toggle(${a.n})">
            </div>
        `).join('');

        document.getElementById('sets-container').innerHTML = [1,2,3,4,5].map(s => {
            const res = validarRegra(s);
            return `
            <div class="set-mini-court">
                <div class="set-title">SET ${s} <span style="color:${res.ok?'var(--success)':'var(--accent)'}">${res.ok?'✓':'✗'}</span></div>
                <div class="court-grid">
                    ${[4,3,2,5,6,1].map(p => `
                        <div class="pos-box">
                            <label>P${p}</label>
                            <select onchange="updatePos('s${s}p${p}', this.value)">
                                <option value="">-</option>
                                ${state.conv.sort((a,b)=>a-b).map(n => `<option value="${n}" ${state.sets['s'+s+'p'+p] == n ? 'selected' : ''}>${n}</option>`).join('')}
                            </select>
                        </div>
                    `).join('')}
                </div>
                <div class="msg-regra" style="color:${res.ok?'#94a3b8':'var(--accent)'}">${res.msg}</div>
            </div>`;
        }).join('');
    }

    window.showTab = (tab) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
        document.getElementById(tab).classList.add('active');
        document.getElementById('btn-' + tab).classList.add('active');
    };

    window.checkPass = () => {
        if(document.getElementById('passInput').value === 'volei2026') {
            document.getElementById('login-screen').style.display = 'none';
            render();
        }
    };
</script>
</body>
</html>
