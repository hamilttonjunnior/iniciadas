<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Volei Pro - Hamilton Jr</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --card: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --accent: #818cf8;
            --success: #22c55e;
            --white: #f8fafc;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, #1e293b, #0b0f1a);
            color: var(--white);
            margin: 0;
            padding-bottom: 100px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Tela de Login */
        #login-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .login-box {
            background: var(--card);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 28px;
            border: 1px solid var(--border);
            text-align: center;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        input[type="password"] {
            width: 100%;
            padding: 14px;
            margin: 24px 0;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.9);
            color: white;
            font-size: 16px;
            text-align: center;
            box-sizing: border-box;
            outline: none;
        }

        input[type="password"]:focus { border-color: var(--primary); }

        .btn-entrar {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: var(--bg);
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Header */
        header {
            padding: 30px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 1px;
            font-weight: 800;
            color: var(--white);
        }

        .sync-badge {
            font-size: 0.6rem;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(74, 222, 128, 0.3);
            font-weight: 800;
        }

        /* Menu de Navegação (Bottom Bar) */
        .nav-bar {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(20px);
            display: flex;
            padding: 6px;
            border-radius: 24px;
            border: 1px solid var(--border);
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .nav-item {
            flex: 1;
            padding: 14px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
            border-radius: 18px;
            transition: 0.3s;
        }

        .nav-item.active {
            background: var(--primary);
            color: var(--bg);
        }

        /* Conteúdo */
        .section { display: none; padding: 20px; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Card Atleta */
        .athlete-card {
            background: var(--card);
            border: 1px solid var(--border);
            margin-bottom: 10px;
            padding: 14px 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .athlete-info { display: flex; align-items: center; gap: 15px; }
        .athlete-num {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: var(--bg);
            font-weight: 800;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        /* Toggle Custom */
        .switch {
            width: 46px;
            height: 24px;
            background: #334155;
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
            appearance: none;
            outline: none;
        }
        .switch:checked { background: var(--success); }
        .switch::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            top: 3px; left: 3px;
            transition: 0.3s;
        }
        .switch:checked::before { left: 25px; }

        /* Grid de Sets */
        .set-title {
            color: var(--primary);
            font-weight: 800;
            margin: 25px 0 12px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .court {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .pos-box {
            background: var(--card);
            padding: 10px;
            border-radius: 14px;
            text-align: center;
        }
        .pos-box label { display: block; font-size: 0.55rem; color: #94a3b8; margin-bottom: 4px; font-weight: 700; }
        
        select {
            background: transparent;
            color: var(--white);
            border: none;
            font-size: 1rem;
            font-weight: 800;
            width: 100%;
            text-align: center;
            outline: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h1 style="color: var(--primary); margin:0">VOLEI PRO</h1>
        <p style="color: #94a3b8; font-size: 0.8rem; margin-top:5px">Hamilton Moraes Jr.</p>
        <input type="password" id="passInput" placeholder="Senha de Acesso">
        <button class="btn-entrar" onclick="checkPass()">ENTRAR</button>
    </div>
</div>

<header>
    <h1>INICIADAS B</h1>
    <div id="sync-status" class="sync-badge" style="display:none;">LIVE</div>
</header>

<div class="nav-bar">
    <div class="nav-item active" id="btn-conv" onclick="showTab('convocacao')">CONVOCAÇÃO</div>
    <div class="nav-item" id="btn-sets" onclick="showTab('sets')">ESCALAÇÃO</div>
</div>

<section id="convocacao" class="section active">
    <div id="athlete-list"></div>
</section>

<section id="sets" class="section">
    <div id="sets-container"></div>
</section>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD3eeZF56QX--Mh8IuR1d78te3hC7c10VQ",
        authDomain: "iniciadas-87351.firebaseapp.com",
        projectId: "iniciadas-87351",
        storageBucket: "iniciadas-87351.firebasestorage.app",
        messagingSenderId: "1029800013091",
        appId: "1:1029800013091:web:6a1020b1099c83f37cf096"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const atletas = [
        {n: 1, nome: "Carla"}, {n: 3, nome: "Barbara"}, {n: 6, nome: "Matilde R."},
        {n: 7, nome: "Matilde S."}, {n: 9, nome: "Nathy"}, {n: 10, nome: "Maria S."},
        {n: 11, nome: "Bia"}, {n: 12, nome: "Carolina R."}, {n: 13, nome: "Clara"},
        {n: 15, nome: "Zita"}, {n: 17, nome: "Malu"}, {n: 19, nome: "Nadii"},
        {n: 20, nome: "Kia"}, {n: 22, nome: "Carolina V."}, {n: 26, nome: "Luana"},
        {n: 55, nome: "Loureiro"}, {n: 99, nome: "Carol"}
    ];

    let state = { conv: [], sets: {} };

    // Sincronização com Firebase
    onSnapshot(doc(db, "gestao", "atual"), (snap) => {
        if(snap.exists()) {
            state = snap.data();
            render();
            document.getElementById('sync-status').style.display = 'block';
        } else {
            render(); 
        }
    });

    async function sync() {
        await setDoc(doc(db, "gestao", "atual"), state);
    }

    window.toggle = (n) => {
        state.conv = state.conv.includes(n) ? state.conv.filter(i => i !== n) : [...state.conv, n];
        sync();
        render();
    };

    window.updatePos = (key, val) => {
        state.sets[key] = val;
        sync();
    };

    function render() {
        // Lista Convocação
        const list = document.getElementById('athlete-list');
        list.innerHTML = atletas.map(a => `
            <div class="athlete-card">
                <div class="athlete-info">
                    <div class="athlete-num">${a.n}</div>
                    <span style="font-weight:600">${a.nome}</span>
                </div>
                <input type="checkbox" class="switch" ${state.conv.includes(a.n) ? 'checked' : ''} onchange="toggle(${a.n})">
            </div>
        `).join('');

        // Grid de Sets
        const setsCont = document.getElementById('sets-container');
        setsCont.innerHTML = [1,2,3,4,5].map(s => `
            <div class="set-title">SET ${s}</div>
            <div class="court">
                ${[4,3,2,5,6,1].map(p => {
                    const id = `s${s}p${p}`;
                    return `
                    <div class="pos-box">
                        <label>POS ${p}</label>
                        <select onchange="updatePos('${id}', this.value)">
                            <option value="">-</option>
                            ${state.conv.sort((a,b)=>a-b).map(n => `
                                <option value="${n}" ${state.sets[id] == n ? 'selected' : ''}>${n}</option>
                            `).join('')}
                        </select>
                    </div>`;
                }).join('')}
            </div>
        `).join('');
    }

    window.showTab = (tab) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
        document.getElementById(tab).classList.add('active');
        document.getElementById('btn-' + (tab == 'convocacao' ? 'conv' : 'sets')).classList.add('active');
    };

    window.checkPass = () => {
        if(document.getElementById('passInput').value === 'volei2026') {
            document.getElementById('login-screen').style.display = 'none';
            render();
        } else {
            alert('Acesso Negado');
        }
    };
</script>
</body>
</html>
