<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Volei Pro - Hamilton Jr</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --card: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --accent: #818cf8;
            --success: #22c55e;
            --white: #f8fafc;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, #1e293b, #0b0f1a);
            color: var(--white);
            margin: 0;
            padding-bottom: 90px;
            min-height: 100vh;
        }

        /* Login Screen */
        #login-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .login-box {
            background: var(--card);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border);
            text-align: center;
            width: 85%;
            max-width: 350px;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px;
            margin: 20px 0;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.8);
            color: white;
            font-size: 16px;
            text-align: center;
            box-sizing: border-box;
        }

        /* Header Moderno */
        header {
            padding: 25px 20px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Tabs de Navegação Estilo iOS */
        .tabs {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            display: flex;
            padding: 8px;
            border-radius: 20px;
            border: 1px solid var(--border);
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 14px;
            transition: 0.3s;
        }

        .tab.active {
            background: var(--primary);
            color: var(--bg);
        }

        /* Seções */
        .section { display: none; padding: 0 20px; animation: slideUp 0.4s ease-out; }
        .section.active { display: block; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Lista Atletas */
        .card-athlete {
            background: var(--card);
            border: 1px solid var(--border);
            margin-bottom: 12px;
            padding: 16px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .info { display: flex; align-items: center; gap: 15px; }
        .num {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: var(--bg);
            font-weight: 800;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }

        /* Checkbox Switch */
        .switch {
            width: 44px;
            height: 24px;
            background: #334155;
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
            appearance: none;
        }
        .switch:checked { background: var(--success); }
        .switch::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: 0.3s;
        }
        .switch:checked::before { left: 23px; }

        /* Quadra de Jogo */
        .set-header {
            margin: 30px 0 15px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .court-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .pos-cell {
            background: var(--card);
            padding: 12px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid transparent;
        }
        .pos-cell label { display: block; font-size: 0.6rem; color: var(--secondary); margin-bottom: 4px; }
        
        select {
            background: transparent;
            color: var(--white);
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            width: 100%;
            text-align: center;
            outline: none;
        }

        .online-tag {
            font-size: 0.6rem;
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            padding: 4px 8px;
            border-radius: 8px;
            text-transform: uppercase;
            font-weight: 800;
        }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h1>Volei Pro</h1>
        <p style="color: #94a3b8; font-size: 0.9rem;">Hamilton Moraes Jr.</p>
        <input type="password" id="passInput" placeholder="Senha de Acesso">
        <button onclick="checkPass()" style="width:100%; padding:14px; border-radius:12px; border:none; background:var(--primary); color:var(--bg); font-weight:bold; cursor:pointer;">Entrar</button>
    </div>
</div>

<header>
    <h1>INICIADAS B</h1>
    <div id="sync-status" class="online-tag" style="display:none;">Sincronizado</div>
</header>

<div class="tabs">
    <div class="tab active" id="tab-conv" onclick="showTab('convocacao')">Convocação</div>
    <div class="tab" id="tab-sets" onclick="showTab('sets')">Escalação</div>
</div>

<section id="convocacao" class="section active">
    <div id="athlete-list"></div>
</section>

<section id="sets" class="section">
    <div id="sets-container"></div>
</section>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD3eeZF56QX--Mh8IuR1d78te3hC7c10VQ",
        authDomain: "iniciadas-87351.firebaseapp.com",
        projectId: "iniciadas-87351",
        storageBucket: "iniciadas-87351.firebasestorage.app",
        messagingSenderId: "1029800013091",
        appId: "1:1029800013091:web:6a1020b1099c83f37cf096"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const atletas = [
        {n: 1, nome: "Carla"}, {n: 3, nome: "Barbara"}, {n: 6, nome: "Matilde R."},
        {n: 7, nome: "Matilde S."}, {n: 9, nome: "Nathy"}, {n: 10, nome: "Maria S."},
        {n: 11, nome: "Bia"}, {n: 12, nome: "Carolina R."}, {n: 13, nome: "Clara"},
        {n: 15, nome: "Zita"}, {n: 17, nome: "Malu"}, {n: 19, nome: "Nadii"},
        {n: 20, nome: "Kia"}, {n: 22, nome: "Carolina V."}, {n: 26, nome: "Luana"},
        {n: 55, nome: "Loureiro"}, {n: 99, nome: "Carol"}
    ];

    let state = { conv: [], sets: {} };

    // Sincronização em tempo real
    onSnapshot(doc(db, "gestao", "atual"), (snap) => {
        if(snap.exists()) {
            state = snap.data();
            render();
            document.getElementById('sync-status').style.display = 'block';
        } else {
            render(); // Renderiza vazio se não houver dados no banco
        }
    });

    async function sync() {
        await setDoc(doc(db, "gestao", "atual"), state);
    }

    window.toggle = (n) => {
        state.conv = state.conv.includes(n) ? state.conv.filter(i => i !== n) : [...state.conv, n];
        sync();
        render();
    };

    window.updatePos = (key, val) => {
        state.sets[key] = val;
        sync();
    };

    function render() {
        const list = document.getElementById('athlete-list');
        list.innerHTML = atletas.map(a => `
            <div class="card-athlete">
                <div class="info">
                    <div class="num">${a.n}</div>
                    <span style="font-weight:600">${a.nome}</span>
                </div>
                <input type="checkbox" class="switch" ${state.conv.includes(a.n) ? 'checked' : ''} onchange="toggle(${a.n})">
            </div>
        `).join('');

        const setsCont = document.getElementById('sets-container');
        setsCont.innerHTML = [1,2,3,4,5].map(s => `
            <div class="set-header"><span>SET ${s}</span></div>
            <div class="court-grid">
                ${[4,3,2,5,6,1].map(p => {
                    const id = `s${s}p${p}`;
                    return `
                    <div class="pos-cell">
                        <label>POS ${p}</label>
                        <select onchange="updatePos('${id}', this.value)">
                            <option value="">-</option>
                            ${state.conv.sort((a,b)=>a-b).map(n => `<option value="${n}" ${state.sets[id] == n ? 'selected' : ''}>${n}</option>`).join('')}
                        </select>
                    </div>`;
                }).join('')}
            </div>
        `).join('');
    }

    window.showTab = (tab) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(tab).classList.add('active');
        document.getElementById('tab-'+tab).classList.add('active');
    };

    window.checkPass = () => {
        if(document.getElementById('passInput').value === 'volei2026') {
            document.getElementById('login-screen').style.display = 'none';
            render();
        } else { alert('Senha Inválida'); }
    };
</script>
</body>
</html>
